    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .docx
      - .txt
      - .md
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      enabled: false
      number_limits: 3
    opening_statement: Bonjour ! Je suis votre assistant de rédaction administrative
      USN. Précisez le type de document, le contexte et les destinataires.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: qc
      id: e-start-qc
      source: start
      sourceHandle: source
      target: qc
      targetHandle: target
      type: custom
