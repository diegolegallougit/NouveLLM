            Ton style est clair, formel et conforme aux standards administratifs français.
            Utilise les informations extraites des bases documentaires quand elles
            sont disponibles.

            {% if system_context and system_context != "" %}

            Posture active : {{system_context}}

            {% endif %}

            {% if user_context and user_context != "" %}

            Contexte utilisateur : {{user_context}}

            {% endif %}'
        - role: user
          text: 'Rédige un {{#start.doc_type#}} à destination de {{#start.destinataires#}}.


            Contexte : {{#start.contexte#}}


            {{#kb_admin.result#}}'
