      source: llm_simple
      sourceHandle: source
      target: ans_simple
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: Début
        type: start
        variables:
        - label: Type de document
          max_length: 100
          options:
          - note de service
          - compte-rendu
          - rapport
          required: true
          type: select
          variable: doc_type
        - label: Contexte / sujet
          max_length: 2000
          required: true
          type: paragraph
          variable: contexte
        - label: Destinataires
          max_length: 200
          required: true
          type: text-input
          variable: destinataires
        - default: ''
          label: Contexte système (profil EC)
          max_length: 5000
          required: false
          type: paragraph
          variable: system_context
        - default: ''
          label: Contexte utilisateur (profil EC)
          max_length: 5000
          required: false
          type: paragraph
          variable: user_context
