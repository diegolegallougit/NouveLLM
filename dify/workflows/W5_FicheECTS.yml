          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: mistral-small-2503
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: 'Tu es IIIAAS, expert pédagogique USN. Réponds à la question.

            {% if system_context and system_context != "" %}

            Posture active : {{system_context}}

            {% endif %}

            {% if user_context and user_context != "" %}

            Contexte utilisateur : {{user_context}}

            {% endif %}'
