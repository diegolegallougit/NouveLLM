app:
  description: Génération de fiches ECTS conformes aux standards USN-LMD
  icon: 🎓
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: advanced-chat
  name: W5 — Fiche ECTS
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: kurokobo/file_tools:0.0.2@8bde7b4d2c30cf22e8f6ce851572af244f7a5776addab94330b820dc2160726c
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.53@a0dfb462961a03c6a6415d4185043185b01017c64da93cf82a9e5ecaf59f8ed0
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .docx
      - .txt
      - .md
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      enabled: false
      number_limits: 3
    opening_statement: Bonjour ! Je génère des fiches ECTS conformes aux standards
      USN. Renseignez titre, objectifs, contenu, niveau, crédits et UFR.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: qc
      id: e-start-qc
      source: start
      sourceHandle: source
      target: qc
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: e-qc-kb_ects
      source: qc
      sourceHandle: t-struct
      target: kb_ects
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      id: e-qc-llm_simple
      source: qc
      sourceHandle: q-simple
      target: llm_simple
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: answer
      id: e-qc-ans_hors
      source: qc
      sourceHandle: h-sujet
      target: ans_hors
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: e-kb_ects-llm_ects
      source: kb_ects
      sourceHandle: source
      target: llm_ects
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: tool
      id: e-llm_ects-file_ects
      source: llm_ects
      sourceHandle: source
      target: file_ects
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: tool
        targetType: answer
      id: e-file_ects-ans_ects
      source: file_ects
      sourceHandle: source
      target: ans_ects
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: e-llm_simple-ans_simple
      source: llm_simple
      sourceHandle: source
      target: ans_simple
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: Début
        type: start
        variables:
        - label: Titre du cours
          max_length: 300
          required: true
          type: text-input
          variable: titre_cours
        - label: Objectifs pédagogiques
          max_length: 1000
          required: true
          type: paragraph
          variable: objectifs
        - label: Contenu du cours
          max_length: 2000
          required: true
          type: paragraph
          variable: contenu
        - label: Niveau
          max_length: 10
          options:
          - L1
          - L2
          - L3
          - M1
          - M2
          - M1/M2
          - L3/M1
          required: true
          type: select
          variable: niveau
        - label: Crédits ECTS
          max_length: 5
          options:
          - '3'
          - '4'
          - '5'
          - '6'
          - '10'
          - '12'
          - '30'
          required: true
          type: select
          variable: credits
        - label: UFR / Département
          max_length: 200
          required: true
          type: text-input
          variable: ufr
        - default: ''
          label: Contexte système (profil EC)
          max_length: 5000
          required: false
          type: paragraph
          variable: system_context
        - default: ''
          label: Contexte utilisateur (profil EC)
          max_length: 5000
          required: false
          type: paragraph
          variable: user_context
      height: 280
      id: start
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      type: custom
      width: 243
    - data:
        classes:
        - id: q-simple
          name: question simple
        - id: t-struct
          name: tâche structurée
        - id: h-sujet
          name: hors sujet
        dataset:
          dataset_id: a0000001-0000-4000-8000-000000000002
          dataset_name: USN - Formations et diplomes (public)
        desc: ''
        instructions: ''
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: mistral-small-2503
          provider: langgenius/openai_api_compatible/openai_api_compatible
        query_variable_selector:
        - sys
        - query
        selected: false
        title: Classification
        type: question-classifier
      height: 189
      id: qc
      position:
        x: 320
        y: 200
      positionAbsolute:
        x: 320
        y: 200
      type: custom
      width: 243
    - data:
        dataset_ids:
        - 88NOaExrhUEBWvpiUnHbIB4CJSCF0IZKBjulSWPHF/7YLc4jOB5LhGxqmPRsfqn5
        - tV4ObBw/8xkxXqlwuzBplkxDLkTbSq6mvQ7Fz75MCDPfL87PGpmAf45Ho++Qignb
        desc: ''
        error_strategy: fail-branch
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: BAAI/bge-reranker-v2-m3
            provider: langgenius/openai_api_compatible/openai_api_compatible
          score_threshold: 0.5
          score_threshold_enabled: true
          top_k: 5
          weights: null
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: Recherche documentaire
        type: knowledge-retrieval
      height: 98
      id: kb_ects
      position:
        x: 620
        y: 300
      positionAbsolute:
        x: 620
        y: 300
      type: custom
      width: 243
    - data:
        context:
          enabled: true
          variable_selector:
          - kb_ects
          - result
        desc: ''
        error_strategy: fail-branch
        memory:
          query_prompt_template: null
          role_prefix:
            assistant: Assistant
            user: Utilisateur
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: mistral-small-2503
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: 'Tu es IIIAAS, expert en ingénierie pédagogique à l''Université Sorbonne
            Nouvelle (Paris 3). Tu rédiges des fiches ECTS conformes aux standards
            LMD français et aux exigences de l''USN. Structure obligatoire : intitulé,
            code UE, UFR/département, crédits ECTS, volume horaire, responsable, prérequis,
            objectifs (savoir/savoir-faire/savoir-être), contenu détaillé, modalités
            évaluation, bibliographie indicative.

            {% if system_context and system_context != "" %}

            Posture active : {{system_context}}

            {% endif %}

            {% if user_context and user_context != "" %}

            Contexte utilisateur : {{user_context}}

            {% endif %}'
        - role: user
          text: 'Rédige une fiche ECTS pour :

            Cours : {{#start.titre_cours#}}

            Objectifs pédagogiques : {{#start.objectifs#}}

            Contenu : {{#start.contenu#}}

            Niveau : {{#start.niveau#}} | Crédits ECTS : {{#start.credits#}} | UFR
            : {{#start.ufr#}}


            Contexte pédagogique USN :

            {{#kb_ects.result#}}'
        selected: false
        title: Rédaction fiche ECTS
        type: llm
        vision:
          enabled: false
      height: 98
      id: llm_ects
      position:
        x: 900
        y: 200
      positionAbsolute:
        x: 900
        y: 200
      type: custom
      width: 243
