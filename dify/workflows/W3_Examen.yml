    opening_statement: "Bonjour. Je conçois des sujets d'examen ancrés dans votre\
      \ cours — pas des sujets génériques que vos étudiants peuvent traiter avec ChatGPT\
      \ sans avoir suivi vos enseignements.\n\nLa qualité du sujet dépend de deux\
      \ choses que vous seul connaissez :\n\n— Ce que vous évaluez : formulez un acquis\
      \ en termes d'action observable.\n ✗ \"Comprendre les théories de la traduction\"\
      \n ✓ \"Mobiliser la théorie du skopos pour justifier un choix de traduction\
      \ sur un texte donné\"\n\n— Ce que vos étudiants ont travaillé que ChatGPT n'a\
      \ pas : textes distribués en cours, débats de TD, cas analysés ensemble. Plus\
      \ vous êtes précis ici, plus le sujet sera résistant.\n\nRenseignez le formulaire.\
      \ Je commence par évaluer si les informations permettent un sujet vraiment résistant,\
      \ puis je produis le sujet avec une analyse concrète de sa robustesse."
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Ce sujet est-il vraiment résistant si mes étudiants utilisent ChatGPT ?
    - Propose une variante avec un document-support à analyser
    - Comment rendre ce sujet résistant sans changer le format ?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
