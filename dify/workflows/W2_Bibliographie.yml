    - data:
        code: "def main(kb_result) -> dict:\n    import re\n    # KB retrieval returns\
          \ a list of {content, score} dicts — convert to formatted text\n    if isinstance(kb_result,\
          \ list):\n        parts = []\n        for i, item in enumerate(kb_result,\
          \ 1):\n            if isinstance(item, dict):\n                content =\
          \ item.get(\"content\", str(item))\n                score = item.get(\"\
          score\", None)\n                s = f\"[{i}]\" + (f\" (score: {score:.3f})\"\
          \ if isinstance(score, float) else \"\")\n                parts.append(s\
          \ + \"\\n\" + content)\n            else:\n                parts.append(str(item))\n\
          \        kb_text = \"\\n\\n\".join(parts)\n    else:\n        kb_text =\
          \ str(kb_result) if kb_result else \"\"\n    refs = re.findall(r'\\[\\d+\\\
          ]', kb_text)\n    unique_count = len(set(refs))\n    if unique_count ==\
          \ 0:\n        paragraphs = [p.strip() for p in kb_text.split('\\n\\n') if\
          \ len(p.strip()) > 50]\n        unique_count = max(1, len(paragraphs) //\
          \ 3)\n    needs_external = \"true\" if unique_count < 5 else \"false\"\n\
          \    return {\n        \"needs_external\": needs_external,\n        \"ref_count\"\
          : unique_count,\n        \"kb_result\": kb_text,\n        \"summary_note\"\
          : \"\",\n    }\n"
        code_language: python3
