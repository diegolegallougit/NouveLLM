    - data:
        code: "def main(arxiv_body: str, hal_body: str, cairn_body: str,\n       \
          \  openedition_body: str, kb_result, nb_refs: str,\n         openalex_body:\
          \ str, semantic_body: str,\n         style_citation: str, concepts_cles:\
          \ str) -> dict:\n    import json, re\n    # Handle kb_result — can be list\
          \ (Dify KB chunks) or string\n    kb_str = \"\"\n    if isinstance(kb_result,\
          \ list):\n        for chunk in kb_result:\n            if isinstance(chunk,\
          \ dict):\n                kb_str += chunk.get('content', '') + '\\n\\n'\n\
          \            elif chunk:\n                kb_str += str(chunk) + '\\n\\\
          n'\n    elif kb_result:\n        kb_str = str(kb_result)\n    else:\n  \
          \      kb_str = \"\"\n    \n    arxiv_body = arxiv_body or \"\"\n    hal_body\
          \ = hal_body or \"\"\n    cairn_body = cairn_body or \"\"\n    openedition_body\
          \ = openedition_body or \"\"\n    openalex_body = openalex_body or \"\"\n\
          \    semantic_body = semantic_body or \"\"\n    sections = []\n\n    # ArXiv\n\
          \    if arxiv_body and len(arxiv_body.strip()) > 30:\n        arxiv_ids\
          \ = re.findall(r'(?:arxiv.org/(?:abs|pdf)/|arXiv:)(\\\\d{4}\\.\\\\d{4,5})',\
          \ arxiv_body, re.IGNORECASE)\n        seen = set()\n        url_block =\
          \ []\n        for aid in arxiv_ids:\n            if aid not in seen:\n \
          \               seen.add(aid)\n                url_block.append(f'https://arxiv.org/abs/{aid}')\n\
          \        if url_block:\n            sections.append(f\"## ArXiv\\n\\n\"\
          \ + '\\n'.join(url_block))\n\n    # HAL\n    if hal_body and len(hal_body.strip())\
          \ > 30:\n        try:\n            hal_data = json.loads(hal_body)\n   \
          \         hal_docs = hal_data.get('response', {}).get('docs', [])\n    \
          \        if hal_docs:\n                hal_refs = []\n                for\
          \ d in hal_docs[:5]:\n                    t = d.get('title_s', [''])[0]\
          \ if isinstance(d.get('title_s'), list) else d.get('title_s', '')\n    \
          \                a = ', '.join(d.get('authFullName_s', []))[:80]\n     \
          \               y = str(d.get('publicationDate_s', ''))[:4]\n          \
          \          u = d.get('uri_s', '')\n                    hal_refs.append(f\"\
          - {t} ({y}) — {a}\" + (f' — {u}' if u else ''))\n                if hal_refs:\n\
          \                    sections.append(f\"## HAL-SHS\\n\\n\" + '\\n'.join(hal_refs[:5]))\n\
          \        except:\n            pass\n\n    # OpenAlex\n    if openalex_body\
          \ and len(openalex_body.strip()) > 30:\n        try:\n            oa = json.loads(openalex_body)\n\
          \            papers = oa.get('results', [])\n            oa_refs = []\n\
          \            for p in papers[:5]:\n                t = p.get('title', p.get('display_name',\
          \ ''))\n                y = str(p.get('publication_year', ''))\n       \
          \         a = ', '.join(x.get('author',{}).get('display_name','') for x\
          \ in p.get('authorships',[]))[:80]\n                u = (p.get('primary_location',{})\
          \ or {}).get('landing_page_url','')\n                oa_refs.append(f\"\
          - {t} ({y}) — {a}\" + (f' — {u}' if u else ''))\n            if oa_refs:\n\
          \                sections.append(f\"## OpenAlex\\n\\n\" + '\\n'.join(oa_refs[:5]))\n\
          \        except:\n            pass\n\n    # Semantic Scholar\n    if semantic_body\
          \ and len(semantic_body.strip()) > 30:\n        try:\n            ss = json.loads(semantic_body)\n\
          \            ss_papers = ss.get('data', [])\n            ss_refs = []\n\
          \            for p in ss_papers[:5]:\n                t = p.get('title',\
          \ '')\n                y = str(p.get('year', ''))\n                a = ',\
          \ '.join(x.get('name','') for x in p.get('authors',[]))[:80]\n         \
          \       u = p.get('url', '')\n                ss_refs.append(f\"- {t} ({y})\
          \ — {a}\" + (f' — {u}' if u else ''))\n            if ss_refs:\n       \
          \         sections.append(f\"## Semantic Scholar\\n\\n\" + '\\n'.join(ss_refs[:5]))\n\
          \        except:\n            pass\n\n    # KB result (always included if\
          \ available)\n    if kb_str and len(kb_str.strip()) > 30:\n        sections.append(f\"\
          ## Publications KB SHS\\n\\n{kb_str}\")\n\n    combined = '\\n\\n'.join(sections)\n\
          \    return {\n        \"combined_refs\": combined,\n        \"new_count\"\
          : len(sections),\n        \"summary_note\": f\"{len(sections)} sources documentaires\"\
          ,\n        \"upload_payload\": \"{}\",\n        \"style_citation\": style_citation\
          \ or \"APA 7\"\n    }"
        code_language: python3
