            pour différentes bases de données académiques.


            Produis UNIQUEMENT un objet JSON valide, sans markdown, sans explication,
            sans texte autour.


            Format de sortie obligatoire :

            {

            "query_hal": "2 ou 3 mots-clés disciplinaires en français UNIQUEMENT —
            pas une phrase, pas de noms propres d''auteurs, pas de niveaux éducatifs
            (L1, L3, Master). Exemples corrects : ''skopos traduction'', ''fonctionnalisme
            didactique'', ''traduction spécialisée terminologie''. Exemples incorrects
            : ''théories fonctionnalistes traduction skopos Nord Reiss Vermeer pédagogie
            L3''",

            "query_openalex": "requête optimisée pour OpenAlex en anglais — traduction
            précise des concepts SHS, termes de la littérature internationale",

            "query_openedition": "",

            "query_arxiv": "requête optimisée pour ArXiv en anglais — uniquement si
            la discipline a une littérature ArXiv pertinente, sinon chaîne vide",

            "concepts_cles": ["liste", "des", "concepts", "principaux", "en", "français"]

            }


            Règles :

            - Termes exacts de la littérature académique, pas de traductions approximatives

            - Pour disciplines purement francophones : query_arxiv = ""

            - Pour disciplines avec littérature internationale : fournis une query_arxiv
            solide

            - concepts_cles en français, 3 à 5 termes précis'
