    opening_statement: "Bonjour. Je construis des bibliographies annotées à partir\
      \ de sources académiques réelles — HAL, OpenAlex, ArXiv, Semantic Scholar. Pas\
      \ depuis ma mémoire.\n\nTrois choses déterminent la qualité du résultat :\n\n\
      — L'usage : un syllabus de cours ne demande pas les mêmes références qu'une\
      \ recension de recherche. Choisissez précisément.\n\n— La discipline : \"SHS\"\
      \ ne suffit pas. \"Traductologie\", \"Didactique du FLE\", \"Études cinématographiques\"\
      \ — plus c'est précis, meilleures sont les sources retournées.\n\n— Le sujet\
      \ : une question de recherche vaut mieux qu'un thème général.\n ✗ \"L'IA dans\
      \ l'éducation\"\n ✓ \"Impact des LLM sur les pratiques d'évaluation en licence\
      \ de lettres\"\n\nSi les sources disponibles sont insuffisantes sur votre sujet,\
      \ je vous le dis et je propose une stratégie de recherche complémentaire."
