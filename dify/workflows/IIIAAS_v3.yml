    - data:
        code: "def main(kb_integria, kb_formations):\n    all_items = []\n    total_score\
          \ = 0.0\n    count = 0\n    for kb_result in [kb_integria, kb_formations]:\n\
          \        if kb_result and isinstance(kb_result, list):\n            for\
          \ item in kb_result:\n                if isinstance(item, dict):\n     \
          \               content = item.get('content', '')\n                    metadata\
          \ = item.get('metadata', {})\n                    score = metadata.get('score',\
          \ 0) if isinstance(metadata, dict) else 0\n                    if isinstance(score,\
          \ (int, float)):\n                        total_score += float(score)\n\
          \                        count += 1\n                        all_items.append(content\
          \ if content else str(item))\n    avg_score = total_score / count if count\
          \ > 0 else 0.0\n    all_results = '\\\n\\\n---\\\n'.join(all_items)\n  \
          \  has_results = avg_score >= 0.2\n    return {\"has_results\": has_results,\
          \ \"all_results\": all_results, \"avg_score\": avg_score, \"doc_count\"\
          : count}"
        code_language: python3
        desc: ''
        error_strategy: fail-branch
        outputs:
          all_results:
            type: string
          avg_score:
            type: number
          doc_count:
            type: number
          has_results:
            type: boolean
