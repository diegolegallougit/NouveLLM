    - data:
        code: "import json as _json\nimport xml.etree.ElementTree as _ET\n\ndef main(source_type:\
          \ str, query: str, doc_text: str, url_content: str, kb_results: str, academic_xml:\
          \ str = \"\", folder_filter: str = \"\",\n    conversation_history: str\
          \ = \"\", web_xml: str = \"\") -> dict:\n    context = \"\"\n    \n    if\
          \ source_type == \"file\" and doc_text:\n        context = \"Document fourni\
          \ :\\n\" + doc_text\n    elif source_type == \"url\" and url_content:\n\
          \        context = \"Contenu de la page web :\\n\" + url_content\n    elif\
          \ kb_results:\n        context = \"Contexte documentaire :\\n\" + kb_results\n\
          \    \n    if academic_xml and academic_xml.strip():\n        try:\n   \
          \         px = _json.loads(academic_xml)\n            xml_src = (px.get(\"\
          xml\") or \"\").strip()\n            if xml_src:\n                try:\n\
          \                    if not xml_src.startswith(\"<sources>\"):\n       \
          \                 xml_src = \"<sources>\" + xml_src + \"</sources>\"\n \
          \                   root = _ET.fromstring(xml_src)\n                   \
          \ formatted = \"SOURCES ACADEMIQUES VERIFIEES :\\n\"\n                 \
          \   for i, src in enumerate(root.findall(\".//source\"), 1):\n         \
          \               titre = src.findtext(\"titre\", \"?\")\n               \
          \         auteurs = src.findtext(\"auteurs\", \"?\")\n                 \
          \       annee = src.findtext(\"annee\", \"?\")\n                       \
          \ url = src.findtext(\"url\", \"\")\n                        resume = src.findtext(\"\
          resume\", \"\")\n                        formatted += f\"\\n[{i}] {auteurs}\
          \ ({annee}). {titre}.\\n URL EXACTE : {url}\\n\"\n                     \
          \   if resume:\n                            formatted += f\" Resume : {resume[:150]}.\\\
          n\"\n                    xml_src = formatted\n                except:\n\
          \                    pass\n                if context:\n               \
          \     context += \"\\n\\n\" + xml_src\n                else:\n         \
          \           context = xml_src\n        except:\n            pass\n    \n\
          \    if conversation_history:\n        try:\n            history = _json.loads(conversation_history)\n\
          \            if isinstance(history, list):\n                recent = history[-10:]\n\
          \                hist_lines = []\n                for m in recent:\n   \
          \                 content = m.get(\"content\") or \"\"\n               \
          \     if content:\n                        role = \"User\" if m.get(\"role\"\
          ) == \"user\" else \"Assis\"\n                        hist_lines.append(role\
          \ + \": \" + content[:200])\n                if hist_lines:\n          \
          \          hist_block = \"[HISTORIQUE]\\n\" + \"\\n\".join(hist_lines) +\
          \ \"\\n[/HISTORIQUE]\"\n                    context = hist_block + (\"\\\
          n\\n\" + context if context else \"\")\n        except:\n            pass\n\
          \    \n\n    if web_xml and web_xml.strip():\n        try:\n           \
          \ wroot = _ET.fromstring(web_xml)\n            formatted = \"SOURCES WEB\
          \ CONSULTEES :\\n\"\n            for i, src in enumerate(wroot.findall(\"\
          .//source\"), 1):\n                url = src.findtext(\"url\", \"\")\n \
          \               titre = src.findtext(\"titre\", \"?\")\n               \
          \ contenu = src.findtext(\"contenu\", \"\")\n                source_attr\
          \ = src.get(\"source\", \"web\")\n                formatted += f\"\\n[{i}]\
          \ {titre}\\n\"\n                formatted += f\" URL EXACTE : {url}\\n\"\
          \n                if contenu:\n                    formatted += f\" Contenu\
          \ : {contenu[:200]}.\\n\"\n            if context:\n                context\
          \ += \"\\n\\n\" + formatted\n            else:\n                context\
          \ = formatted\n        except:\n            pass\n\n\n    # Si mode academique\
          \ mais XML vide ou count = 0\n    if source_type == \"kb\" and not academic_xml\
          \ or (academic_xml and academic_xml.strip()):\n        pass  # deja gere\
