    - data:
        code: "import json\nimport xml.etree.ElementTree as ET\nimport urllib.request\n\
          \ndef main(academic_xml: str, query: str) -> dict:\n    # Si pas de donnees\
          \ proxy → passer directement\n    if not academic_xml or not academic_xml.strip():\n\
          \        return {\"reranked_xml\": \"\", \"reranked_count\": 0}\n\n    try:\n\
          \        proxy_data = json.loads(academic_xml)\n    except Exception:\n\
          \        return {\"reranked_xml\": academic_xml, \"reranked_count\": 0}\n\
          \n    xml_str = (proxy_data.get(\"xml\") or \"\").strip()\n    if not xml_str:\n\
          \        return {\"reranked_xml\": academic_xml, \"reranked_count\": 0}\n\
          \n    # Parser le XML des sources\n    try:\n        if not xml_str.startswith(\"\
          <sources>\"):\n            xml_str = \"<sources>\" + xml_str + \"</sources>\"\
          \n        root = ET.fromstring(xml_str)\n        sources = root.findall(\"\
          .//source\")\n    except Exception:\n        return {\"reranked_xml\": academic_xml,\
          \ \"reranked_count\": 0}\n\n    if not sources:\n        return {\"reranked_xml\"\
          : academic_xml, \"reranked_count\": 0}\n\n    # Construire les textes pour\
          \ TEI (titre + resume)\n    texts = []\n    for src in sources:\n      \
          \  titre = src.findtext(\"titre\", \"\")\n        resume = src.findtext(\"\
          resume\", \"\")\n        text = (titre + \" \" + resume).strip()[:512]\n\
          \        texts.append(text if text else titre or \"\")\n\n    # Appel TEI\
          \ Reranker\n    try:\n        payload = json.dumps({\n            \"query\"\
          : query,\n            \"texts\": texts,\n            \"truncate\": True\n\
          \        }).encode(\"utf-8\")\n\n        req = urllib.request.Request(\n\
          \            \"${RERANKER_URL}",\n            data=payload,\n\
          \            headers={\"Content-Type\": \"application/json\"},\n       \
          \     method=\"POST\"\n        )\n        with urllib.request.urlopen(req,\
          \ timeout=8) as resp:\n            scores = json.loads(resp.read().decode(\"\
          utf-8\"))\n    except Exception:\n        # Si TEI indisponible → fallback\
          \ sans reranking\n        return {\"reranked_xml\": academic_xml, \"reranked_count\"\
          : len(sources)}\n\n    # Filtrer (score >= 0.05) et garder top 5\n    SCORE_THRESHOLD\
          \ = 0.05\n    TOP_K = 5\n\n    filtered = [s for s in scores if s.get(\"\
          score\", 0) >= SCORE_THRESHOLD]\n    top = filtered[:TOP_K]\n\n    if not\
          \ top:\n        # Si tout filtre → garder le meilleur quand meme\n     \
          \   top = scores[:1]\n\n    # Reconstruire le XML dans l'ordre reranked\n\
          \    reranked_sources = []\n    for rank, item in enumerate(top, 1):\n \
          \       idx = item[\"index\"]\n        if idx < len(sources):\n        \
          \    src = sources[idx]\n            src.set(\"rerank_score\", f\"{item['score']:.3f}\"\
          )\n            src.set(\"id\", str(rank))\n            reranked_sources.append(ET.tostring(src,\
          \ encoding=\"unicode\"))\n\n    reranked_xml = \"<sources>\\n\" + \"\\n\"\
          .join(reranked_sources) + \"\\n</sources>\"\n\n    # Reconstruire le JSON\
          \ proxy avec XML reranked\n    proxy_data[\"xml\"] = reranked_xml\n    proxy_data[\"\
          reranked\"] = True\n    proxy_data[\"reranked_count\"] = len(top)\n    proxy_data[\"\
          original_count\"] = len(sources)\n\n    return {\n        \"reranked_xml\"\
          : json.dumps(proxy_data),\n        \"reranked_count\": len(top)\n    }"
