    - data:
        code: "def main(query: str, files: list, source_mode: str = \"usn\") -> dict:\n\
          \    import re\n    has_file = len(files) > 0 if files else False\n    urls\
          \ = re.findall(r'https?://[^\\s]+', query)\n    has_url = len(urls) > 0\n\
          \    \n    is_academic_explicit = source_mode == \"academic\"\n    \n  \
          \  academic_signals = [\n        r'\\btravaux?\\b', r'\\brecherche\\b',\
          \ r'\\bpublications?\\b',\n        r'\\barticles?\\b', r'\\blitterature\\\
          b',\n        r'\\bbibliograph\\w+\\b', r'\\bsources?\\b',\n        r'\\\
          bétat de l.art\\b', r'\\bqui a ecrit\\b',\n        r'\\bqui travaille\\\
          b',\n    ]\n    \n    is_academic_auto = False\n    if source_mode in (\"\
          usn\", \"all\") and not has_file and not has_url:\n        query_lower =\
          \ query.lower()\n        for pattern in academic_signals:\n            if\
          \ re.search(pattern, query_lower, re.IGNORECASE):\n                is_academic_auto\
          \ = True\n                break\n    \n    is_academic = is_academic_explicit\
          \ or is_academic_auto\n    is_web = source_mode == \"web\"\n    is_docs\
          \ = source_mode == \"docs\"\n    \n    if is_web and not has_url:\n    \
          \    source_type = \"web_no_url\"\n    else:\n        source_type = \"file\"\
          \ if has_file else (\"url\" if has_url else \"kb\")\n    \n    return {\n\
          \        \"has_file\": has_file,\n        \"has_url\": has_url,\n      \
          \  \"source_type\": source_type,\n        \"first_url\": urls[0] if urls\
          \ else \"\",\n        \"is_academic\": is_academic,\n        \"is_academic_auto\"\
          : is_academic_auto,\n        \"is_web\": is_web,\n        \"is_docs\": is_docs,\n\
          \        \"source_mode\": source_mode,\n    }"
        code_language: python3
