    - data:
        code: "def main(urls: str, count: int, search_data: str, query: str) -> dict:\n\
          \    import urllib.request, json, urllib.parse\n    from xml.sax.saxutils\
          \ import escape\n\n    url_list = [u for u in urls.split(\"\\n\") if u.strip()][:5]\n\
          \    if not url_list:\n        return {\"web_xml\": \"\", \"fetched_count\"\
          : 0}\n\n    try:\n        sdata = json.loads(search_data)\n    except Exception:\n\
          \        sdata = []\n\n    parts = []\n\n    for i, url in enumerate(url_list):\n\
          \        src_id = str(i + 1)\n        meta = {}\n        if i < len(sdata):\n\
          \            meta = sdata[i]\n\n        title = escape(meta.get(\"title\"\
          , \"\") or \"\")\n        snippet = escape(meta.get(\"content\", \"\") or\
          \ \"\")\n\n        if i < 2:\n            # Sources 1-2 : Jina Reader\n\
          \            try:\n                encoded_url = urllib.parse.quote(url,\
          \ safe='')\n                jina_url = f\"https://r.jina.ai/{encoded_url}\"\
          \n                jreq = urllib.request.Request(jina_url, headers={\"Accept\"\
          : \"text/plain\"})\n                with urllib.request.urlopen(jreq, timeout=8)\
          \ as resp:\n                    jina_content = resp.read().decode(\"utf-8\"\
          ).strip()\n                content = escape(jina_content[:500])\n      \
          \          source_type = \"jina\"\n            except Exception as e:\n\
          \                content = escape(f\"[Erreur Jina] {str(e)[:100]}\")\n \
          \               if snippet:\n                    content = escape(snippet[:300])\n\
          \                source_type = \"jina_fallback\"\n        else:\n      \
          \      # Sources 3-5 : extrait SearXNG\n            content = escape(snippet[:500])\
          \ if snippet else \"\"\n            source_type = \"searxng\"\n\n      \
          \  xml_lines = []\n        xml_lines.append(f'  <source id=\"{src_id}\"\
          \ source=\"{source_type}\">')\n        xml_lines.append(f'    <url>{escape(url)}</url>')\n\
          \        xml_lines.append(f'    <titre>{title}</titre>')\n        xml_lines.append(f'\
          \    <contenu>{content}</contenu>')\n        xml_lines.append(f'  </source>')\n\
          \        parts.append(\"\\n\".join(xml_lines))\n\n    web_xml = \"<sources>\\\
          n\" + \"\\n\".join(parts) + \"\\n</sources>\"\n\n    return {\"web_xml\"\
          : web_xml, \"fetched_count\": len(url_list)}\n"
